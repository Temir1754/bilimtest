# Каждый час: сайт открывается и база отвечает (DECISIONS.md №105). Не отвечает три раза подряд с паузой —
# задача падает, и GitHub присылает письмо владельцу. Заодно бесплатная база Supabase не «засыпает» без посетителей.
name: Сайт работает
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Сайт открывается
        run: curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 -o /dev/null "${SITE_URL:-https://bilimtest-chi.vercel.app}/"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: База отвечает
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 -o /dev/null \
            -X POST "$SUPABASE_URL/rest/v1/rpc/site_catalog" -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
